name: release

on:
  push:
    tags: ["v0.1.0"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Require public repository for provenance
        run: |
          if [ "${{ github.event.repository.visibility }}" != "public" ]; then
            echo "Publish the reviewed repository and enable public protections before pushing a release tag." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack
      - run: sha256sum deepseek-harness-runcase-adapter-0.1.0.tgz > SHA256SUMS
      - uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: deepseek-harness-runcase-adapter-0.1.0.tgz
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.0 --prerelease --title "v0.1.0 developer preview" --notes-file docs/releases/v0.1.0.md deepseek-harness-runcase-adapter-0.1.0.tgz SHA256SUMS
