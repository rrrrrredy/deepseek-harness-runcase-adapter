name: release

on:
  push:
    tags: ["v0.1.0"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack
      - run: sha256sum deepseek-harness-runcase-adapter-0.1.0.tgz > SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: deepseek-harness-runcase-adapter-0.1.0.tgz
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.0 --prerelease --title "v0.1.0 developer preview" --notes-file docs/releases/v0.1.0.md deepseek-harness-runcase-adapter-0.1.0.tgz SHA256SUMS
