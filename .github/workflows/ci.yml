name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-adapter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: ${{ matrix.label }} contract and package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
          - os: ubuntu-24.04
            label: Ubuntu x64
          - os: macos-14
            label: macOS arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
