name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-adapter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: ${{ matrix.label }} contract and package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
          - os: ubuntu-24.04
            label: Ubuntu x64
          - os: macos-14
            label: macOS arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
